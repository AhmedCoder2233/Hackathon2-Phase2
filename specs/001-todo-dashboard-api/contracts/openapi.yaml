openapi: 3.0.0
info:
  title: Todo API
  version: 1.0.0
  description: API for managing user todos.
servers:
  - url: http://localhost:8000
paths:
  /todos/:
    get:
      summary: Get all todos for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A list of todo items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
        '401':
          description: Unauthorized
    post:
      summary: Create a new todo item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '200':
          description: The created todo item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Unauthorized
        '422':
          description: Validation Error
  /todos/{todo_id}:
    parameters:
      - in: path
        name: todo_id
        schema:
          type: string
        required: true
        description: ID of the todo item
    put:
      summary: Update an existing todo item
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: The updated todo item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Unauthorized
        '404':
          description: Todo not found
        '422':
          description: Validation Error
    delete:
      summary: Delete a todo item
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Todo item deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Todo not found
  /todos/{todo_id}/complete:
    parameters:
      - in: path
        name: todo_id
        schema:
          type: string
        required: true
        description: ID of the todo item
    patch:
      summary: Toggle completion status of a todo item
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The updated todo item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Unauthorized
        '404':
          description: Todo not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Todo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, completed]
        priority:
          type: string
          enum: [low, medium, high]
        due_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - user_id
        - title
        - status
        - priority
        - created_at
        - updated_at
    CreateTodoRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
          default: medium
        due_date:
          type: string
          format: date-time
          nullable: true
      required:
        - title
        - priority
    UpdateTodoRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, medium, high]
          nullable: true
        due_date:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [pending, completed]
          nullable: true
