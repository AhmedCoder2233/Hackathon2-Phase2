## API Endpoints Specification

### Authentication Endpoints

#### POST /auth/signup
**Purpose:** Register new user  
**Request Body:**
```json
{
    "email": "user@example.com",
    "password": "SecurePass123!",
    "full_name": "John Doe"
}
```
**Response (201):**
```json
{
    "user_id": "uuid",
    "email": "user@example.com",
    "message": "User registered successfully"
}
```

#### POST /auth/signin
**Purpose:** User login  
**Request Body:**
```json
{
    "email": "user@example.com",
    "password": "SecurePass123!"
}
```
**Response (200):**
```json
{
    "access_token": "jwt_token",
    "token_type": "bearer",
    "user": {
        "id": "uuid",
        "email": "user@example.com",
        "full_name": "John Doe"
    }
}
```

#### POST /auth/signout
**Purpose:** User logout  
**Headers:** `Authorization: Bearer {token}`  
**Response (200):**
```json
{
    "message": "Signed out successfully"
}
```

### Todo Endpoints

#### GET /todos
**Purpose:** Get all todos for authenticated user  
**Headers:** `Authorization: Bearer {token}`  
**Query Parameters:**
- `status` (optional): pending | completed | all
- `priority` (optional): low | medium | high
- `page` (optional): integer (default: 1)
- `limit` (optional): integer (default: 20)

**Response (200):**
```json
{
    "todos": [
        {
            "id": "uuid",
            "title": "Complete project",
            "description": "Finish Phase II implementation",
            "status": "pending",
            "priority": "high",
            "due_date": "2025-12-15",
            "created_at": "2025-12-07T10:00:00Z",
            "updated_at": "2025-12-07T10:00:00Z"
        }
    ],
    "total": 10,
    "page": 1,
    "limit": 20
}
```

#### POST /todos
**Purpose:** Create new todo  
**Headers:** `Authorization: Bearer {token}`  
**Request Body:**
```json
{
    "title": "New task",
    "description": "Task description",
    "priority": "medium",
    "due_date": "2025-12-15"
}
```
**Response (201):**
```json
{
    "id": "uuid",
    "title": "New task",
    "status": "pending",
    "created_at": "2025-12-07T10:00:00Z"
}
```

#### GET /todos/{todo_id}
**Purpose:** Get specific todo  
**Headers:** `Authorization: Bearer {token}`  
**Response (200):** Single todo object

#### PUT /todos/{todo_id}
**Purpose:** Update todo  
**Headers:** `Authorization: Bearer {token}`  
**Request Body:**
```json
{
    "title": "Updated title",
    "description": "Updated description",
    "status": "completed",
    "priority": "high"
}
```
**Response (200):** Updated todo object

#### DELETE /todos/{todo_id}
**Purpose:** Delete todo  
**Headers:** `Authorization: Bearer {token}`  
**Response (204):** No content

